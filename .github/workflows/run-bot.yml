name: Run SLRC News Bot

on:
  schedule:
    # 04:07 AM San Luis Río Colorado (UTC-7) = 11:07 UTC
    # Se usa :07 para evitar la alta carga de GitHub Actions
    # que normalmente ocurre al inicio de cada hora.
    - cron: '7 11 * * *'

  # Permite ejecutar manualmente desde GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slrc-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. DESCARGAR REPOSITORIO
      # ======================================================

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # 2. CONFIGURAR PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ======================================================
      # 3. INSTALAR DEPENDENCIAS
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow


      # ======================================================
      # 4. EJECUTAR BOT
      # ======================================================

      - name: Run bot
        run: python telegram_bot.py
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}


      # ======================================================
      # 5. GUARDAR HISTORIAL
      # ======================================================

      - name: Save bot history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias_enviadas.json

          if git diff --cached --quiet; then
            echo "No changes in noticias_enviadas.json"
            exit 0
          fi

          git commit -m "Update noticias_enviadas.json"

          git pull --rebase origin main

          git push origin HEAD:main
