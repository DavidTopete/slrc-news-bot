name: Run SLRC News Bot

on:
  schedule:
    # 04:00 AM San Luis Río Colorado (UTC-7) = 11:00 UTC
    - cron: '0 11 * * *'

  # Permite ejecutarlo manualmente desde GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slrc-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # 1. Descargar repositorio
      # ------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # 2. Instalar Python
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ------------------------------------------------------
      # 3. Instalar dependencias
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ------------------------------------------------------
      # 4. Ejecutar bot
      # ------------------------------------------------------
      - name: Run bot
        run: python telegram_bot.py
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      # ------------------------------------------------------
      # 5. Guardar historial de noticias enviadas
      # ------------------------------------------------------
      - name: Save bot history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias_enviadas.json

          if git diff --cached --quiet; then
            echo "No changes in noticias_enviadas.json"
            exit 0
          fi

          git commit -m "Update noticias_enviadas.json"

          git pull --rebase origin main

          git push origin HEAD:main
